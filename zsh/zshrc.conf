# ZSH Settings

export PATH=$PATH:/usr/local/git/bin:/usr/local/bin
export PATH=~/.local/bin:$PATH

# Auto-update repos (max once per interval)
auto_pull_repo() {
  local name="$1"
  local dir="$2"
  local interval="$3"
  local timestamp_file="$HOME/.${name}_last_pull"

  [[ ! -d "$dir/.git" ]] && return

  if [[ ! -f "$timestamp_file" ]]; then
    echo "📦 Pulling $name (first run)..."
    (cd "$dir" && git pull && date +%s > "$timestamp_file")
  elif [[ $(($(date +%s) - $(cat "$timestamp_file"))) -gt $interval ]]; then
    local days_ago=$(( ($(date +%s) - $(cat "$timestamp_file")) / 86400 ))
    echo "📦 Pulling $name (last updated $days_ago days ago)..."
    (cd "$dir" && git pull && date +%s > "$timestamp_file")
  fi
}

WEEKLY=$((7 * 24 * 60 * 60))
DAILY=$((24 * 60 * 60))

# dotfiles now carries claude/ too, so it pulls daily (was weekly)
auto_pull_repo "dotfiles" "$HOME/dotfiles" $DAILY

# Auto-install TPM if not present
if [[ ! -d "$HOME/.tmux/plugins/tpm" ]]; then
  echo "📦 Installing TPM (tmux plugin manager)..."
  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
fi
auto_pull_repo "tpm" "$HOME/.tmux/plugins/tpm" $WEEKLY

for alias_cp in $HOME/workplace/azuleeDevScripts/src/AzuleeDevScripts/zsh/amazon_aliases.zsh;do
	[ -f "$alias_cp" ] && cp $alias_cp $HOME/dotfiles/zsh/
done

folder="$HOME/dotfiles/zsh"
for file in $folder/*;do
	if [[ "$file" != *".conf" ]];then
		source $file
	fi
done

private_folder="$HOME/dotfiles-private/zsh"
if [[ -d "$private_folder" ]]; then
	for file in $private_folder/*;do
		if [[ -f "$file" && "$file" != *".conf" ]];then
			source $file
		fi
	done
fi

# Keep ~/.claude in sync with ~/dotfiles/ai/claude on every new shell.
# claude_merge_config (zsh/functions.zsh) is idempotent and silent when
# nothing changed, so this is cheap to run unconditionally.
(( $+functions[claude_merge_config] )) && claude_merge_config
