# Local startup only. Installation and updates belong to ~/dotfiles/deploy.sh.
# Discover Homebrew on both Apple Silicon and Intel, without running brew.
typeset -U path
path=("$HOME/.local/bin" "$HOME/.opencode/bin" /opt/homebrew/bin /opt/homebrew/sbin /usr/local/bin /usr/local/sbin $path)

for file in "$HOME"/dotfiles/zsh/*.zsh(N); do
  source "$file"
done
for file in "$HOME"/dotfiles-private/zsh/*.zsh(N); do
  source "$file"
done
unset file
