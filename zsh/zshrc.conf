# Local startup only. Installation and updates belong to ~/dotfiles/deploy.sh.
# Discover Homebrew on both Apple Silicon and Intel, without running brew.
typeset -U path
path=("$HOME/.local/bin" /opt/homebrew/bin /opt/homebrew/sbin /usr/local/bin /usr/local/sbin $path)
# Keg-only libpq (psql, pg_dump); Homebrew does not link it into bin.
path=({/opt/homebrew,/usr/local}/opt/libpq/bin(N) $path)

for file in "$HOME"/dotfiles/zsh/*.zsh(N); do
  source "$file"
done
# Each active hub (see zsh/hubs.zsh) may contribute shell config.
for hub in ${(f)"$(hubs_list 2>/dev/null)"}; do
  for file in "$hub"/zsh/*.zsh(N); do
    source "$file"
  done
done
unset file hub
